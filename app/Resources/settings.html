<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — New Music Research</title>
<style>
:root {
  --bg: #08090c;
  --surface: #0f1117;
  --surface-2: #151822;
  --surface-3: #1b1f2c;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text: #eef1f7;
  --text-2: #b4bdd0;
  --muted: #8490a8;
  --accent: #00e5ff;
  --accent-dim: rgba(0, 229, 255, 0.14);
  --accent-border: rgba(0, 229, 255, 0.42);
  --green: #18e070;
  --green-dim: rgba(24, 224, 112, 0.14);
  --amber: #f5b942;
  --amber-dim: rgba(245, 185, 66, 0.15);
  --danger: #ff5c72;
  --danger-dim: rgba(255, 92, 114, 0.15);
  --shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
}

html[data-theme="light"] {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #eaeff6;
  --border: rgba(15, 23, 42, 0.11);
  --border-strong: rgba(15, 23, 42, 0.22);
  --text: #111827;
  --text-2: #374151;
  --muted: #5b6577;
  --accent: #0077cc;
  --accent-dim: rgba(0, 119, 204, 0.11);
  --accent-border: rgba(0, 119, 204, 0.36);
  --green: #128a49;
  --green-dim: rgba(18, 138, 73, 0.12);
  --amber: #b4690e;
  --amber-dim: rgba(180, 105, 14, 0.12);
  --danger: #c8233c;
  --danger-dim: rgba(200, 35, 60, 0.11);
  --shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.layout {
  display: grid;
  grid-template-columns: 276px 1fr;
  height: 100vh;
  width: 100vw;
}

/* Left Rail */
.rail {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 36px 14px 16px;
  min-height: 0;
}

.rail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px 12px;
}

.rail-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.icon-btn:hover {
  background: var(--surface-3);
  border-color: var(--border-strong);
  color: var(--text);
}

.search-wrap {
  position: relative;
  margin-bottom: 14px;
}

.search-input {
  width: 100%;
  padding: 9px 32px 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-size: 14px;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-input:focus {
  border-color: var(--accent-border);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.search-input::placeholder { color: var(--muted); }

.clear-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 50%;
  background: var(--surface-3);
  color: var(--text-2);
  font-size: 11px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
}
.clear-btn.visible { display: inline-flex; }
.clear-btn:hover { background: var(--accent-dim); color: var(--text); }

.nav-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 2px;
}

.nav-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
  transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
}
.nav-row:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav-row.active {
  background: var(--accent-dim);
  border-color: var(--accent-border);
  color: var(--text);
  font-weight: 600;
}
.nav-row.dragging {
  opacity: 0.45;
  border-style: dashed;
  border-color: var(--accent);
}
.nav-row.drop-before::before,
.nav-row.drop-after::after,
.playlist-row.drop-before::before,
.playlist-row.drop-after::after {
  content: "";
  position: absolute;
  left: 6px;
  right: 6px;
  height: 3px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow, var(--accent));
  pointer-events: none;
  z-index: 10;
}
.nav-row.drop-before::before { top: -5px; }
.nav-row.drop-after::after   { bottom: -5px; }

.drag-grip {
  color: var(--muted);
  font-size: 15px;
  line-height: 1;
  cursor: grab;
  padding: 2px 4px;
  border-radius: 5px;
  flex-shrink: 0;
}
.drag-grip:hover { color: var(--text); background: var(--surface-3); }

.nav-label {
  flex: 1;
  font-size: 14px;
  text-align: left;
  word-break: break-word;
}

.kbd-hint {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--muted);
  flex-shrink: 0;
}

.rail-footer {
  padding-top: 12px;
  border-top: 1px solid var(--border);
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* Right Content Pane */
.main-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg);
}

.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 38px 36px 72px;
  min-height: 0;
}

.scroll-fade {
  position: sticky;
  bottom: 0;
  left: 0;
  right: 0;
  height: 54px;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--bg) 82%);
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12px;
}
.scroll-fade.visible { display: flex; }

.more-pill {
  pointer-events: auto;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.more-pill:hover { color: var(--text); border-color: var(--accent-border); }

.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.section-header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.section-subtitle {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 6px;
  color: var(--text);
}
.card-desc {
  font-size: 13.5px;
  color: var(--muted);
  margin: 0 0 14px;
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.btn-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 9px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
}
.btn:hover { background: var(--surface-3); border-color: var(--accent-border); }
.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--accent-dim);
  border-color: var(--accent-border);
  color: var(--text);
}
.btn-danger {
  background: var(--danger-dim);
  border-color: rgba(255, 92, 114, 0.38);
  color: var(--danger);
}
.btn-danger:hover {
  background: rgba(255, 92, 114, 0.24);
  border-color: var(--danger);
}
.btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }

.path-box {
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 10px 12px;
  border-radius: 9px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  word-break: break-all;
  margin-bottom: 12px;
}

/* Appearance Swatch Cards */
.appearance-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.theme-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s ease, transform 0.14s ease, background 0.15s ease;
}
.theme-card:hover { border-color: var(--border-strong); }
.theme-card.selected {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.theme-preview {
  height: 86px;
  border-radius: 9px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid rgba(128, 140, 160, 0.24);
}
.theme-preview.dark-prev {
  background: #08090c;
  color: #eef1f7;
}
.theme-preview.light-prev {
  background: #f6f8fb;
  color: #111827;
}
.prev-bar {
  display: flex;
  gap: 6px;
  align-items: center;
}
.prev-dot { width: 8px; height: 8px; border-radius: 50%; background: #00e5ff; }
.light-prev .prev-dot { background: #0077cc; }
.prev-line { height: 7px; border-radius: 4px; flex: 1; background: rgba(255,255,255,0.14); }
.light-prev .prev-line { background: rgba(15,23,42,0.14); }
.prev-blocks { display: flex; gap: 6px; }
.prev-block { flex: 1; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); }
.light-prev .prev-block { background: #ffffff; border: 1px solid rgba(15,23,42,0.12); }

.theme-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 600;
  color: var(--text);
}
.badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid var(--accent-border);
}

/* Toggle Switch */
.switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  inset: 0;
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.16s ease, border-color 0.16s ease;
}
.slider::before {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  left: 2px;
  top: 2px;
  border-radius: 50%;
  background: var(--text);
  transition: transform 0.16s ease;
}
.switch input:checked + .slider {
  background: var(--accent-dim);
  border-color: var(--accent);
}
.switch input:checked + .slider::before {
  transform: translateX(20px);
  background: var(--accent);
}

/* Shortcuts Filter & Multi-Combo Rows */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.filter-bar .search-wrap {
  flex: 1;
  margin: 0;
}
.press-keys-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 5px 9px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
}
.press-keys-pill.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}
.match-count {
  font-size: 12.5px;
  color: var(--muted);
  font-family: var(--font-mono);
}

.shortcut-group-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 0 8px;
}

.shortcut-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 14px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.shortcut-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 180px;
}
.shortcut-name { font-weight: 600; color: var(--text); }
.shortcut-id { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

.combo-area {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.combo-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px 4px 10px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text);
}
.combo-remove {
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  padding: 0 2px;
  line-height: 1;
}
.combo-remove:hover { color: var(--danger); }

.record-btn {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px dashed var(--border-strong);
  background: transparent;
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}
.record-btn:hover { border-color: var(--accent); color: var(--text); }
.record-btn.listening {
  border-style: solid;
  border-color: var(--accent);
  background: var(--accent-dim);
  color: var(--accent);
}

.conflict-banner {
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--amber-dim);
  border: 1px solid rgba(245, 185, 66, 0.45);
  color: var(--text);
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}
.conflict-banner.visible { display: block; }

/* URL Commands */
.route-card {
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 10px;
}
.route-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.route-url {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  word-break: break-all;
}
.route-summary {
  color: var(--text-2);
  font-size: 13.5px;
  margin-bottom: 6px;
}
.route-params {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  word-break: break-word;
}

.search-match-group {
  margin-bottom: 18px;
}
.search-match-badge {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 8px;
}

.empty-state {
  padding: 28px;
  text-align: center;
  border-radius: 12px;
  border: 1px dashed var(--border-strong);
  color: var(--muted);
}

/* NAGA Confirm Modal (replaces native confirm/NSAlert) */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 7, 11, 0.74);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 900;
  padding: 24px;
}
.modal-backdrop.open { display: flex; }

.naga-modal {
  width: min(640px, 100%);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  padding: 24px;
  box-shadow: var(--shadow);
}
.naga-modal-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.naga-modal-tile {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--danger);
  background: var(--danger-dim);
  border: 1px solid rgba(255, 92, 114, 0.38);
  box-shadow: 0 0 18px rgba(255, 92, 114, 0.14);
  flex-shrink: 0;
}
.naga-modal-tile svg {
  width: 22px;
  height: 22px;
  display: block;
  filter: drop-shadow(0 0 6px currentColor);
}
.naga-modal-tile.accent {
  color: var(--accent);
  background: var(--accent-dim);
  border-color: var(--accent-border);
  box-shadow: 0 0 18px rgba(0, 240, 255, 0.14);
}
.btn svg {
  width: 14px;
  height: 14px;
  display: block;
}
@keyframes nmrSpin {
  to { transform: rotate(360deg); }
}
.nmr-spin {
  animation: nmrSpin 0.85s linear infinite;
}
.naga-modal-title {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
}
.naga-modal-sub {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 13.5px;
}
.naga-facts {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0 18px;
  font-size: 13.5px;
}
.naga-facts td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  word-break: break-word;
}
.naga-facts td:first-child {
  width: 150px;
  color: var(--muted);
  font-weight: 600;
}
.naga-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.modal-input {
  width: 100%;
  box-sizing: border-box;
  margin: 6px 0 18px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.modal-input:focus {
  border-color: var(--accent);
}

/* Themes & Appearance Swatches */
.theme-swatch-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.swatch-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.swatch-card:hover {
  transform: translateY(-1px);
  border-color: var(--border-strong);
}
.swatch-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-dim);
}
.swatch-preview {
  height: 54px;
  border-radius: 8px;
  padding: 8px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid rgba(128, 128, 128, 0.22);
}
.swatch-top {
  display: flex;
  align-items: center;
  gap: 6px;
}
.swatch-dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  flex-shrink: 0;
}
.swatch-bar {

<script>
const SECTION_META = {
  general: { id: "general", title: "General", badge: "⌃G", keywords: ["general", "history", "data", "folder", "finder", "clear", "zoom", "log", "storage"] },
  appearance: { id: "appearance", title: "Appearance", badge: "⌃A", keywords: ["appearance", "theme", "dark", "light", "dracula", "yellow", "menu bar", "git", "worktree", "color", "swatch", "folder"] },
  playlists: { id: "playlists", title: "Playlist Order", badge: "⌃P", keywords: ["playlist", "order", "preset", "tidal", "url", "sort", "sequence", "tracks", "page"] },
  shortcuts: { id: "shortcuts", title: "Shortcuts", badge: "⌃H", keywords: ["shortcut", "hotkey", "key", "binding", "combo", "keyboard", "record"] },
  urls: { id: "urls", title: "URL Commands", badge: "⌃U", keywords: ["url", "scheme", "nmr://", "deep link", "automation", "command", "route"] },
};

const RESERVED_COMBOS = new Set(["cmd+q", "cmd+w", "cmd+h", "cmd+m", "cmd+c", "cmd+v", "cmd+x", "cmd+a", "cmd+z"]);

let STATE = {
  activeSection: "general",
  sectionOrder: ["general", "appearance", "playlists", "shortcuts", "urls"],
  appearance: "dark",
  pageZoom: 1.0,
  showWorktreeMenu: true,
  storePath: "~/Library/Application Support/New Music Research/history.json",
  runCount: 0,
  shortcuts: [],
  urlRoutes: [],
  themes: {
    activeThemeId: "dracula",
    activeThemeName: "Dracula",
    currentSide: "dark",
    nameDisplay: "custom",
    folderPath: "~/Development/Themes/New Music Research",
    rootPath: "~/Development/Themes",
    isCustomFolder: false,
    error: "",
    listedThemes: [],
    totalCount: 0,
  },
  playlistOrder: {
    activePresetId: "default",
    defaultPlaylists: [],
    presets: [],
    presetsPath: "",
  },
  searchQuery: "",
  shortcutFilter: "",
  pressKeysFilter: false,
  recordingActionId: null,
  conflictMessage: "",
};

let confirmResolver = null;
let nameModalResolver = null;
let dragSectionId = null;
let dragPlaylistUrl = null;

function post(payload) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nmrSettings) {
    window.webkit.messageHandlers.nmrSettings.postMessage(payload);
  }
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove("show"), 2000);
}

function escapeHTML(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function setTheme(appearance) {
  STATE.appearance = appearance === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", STATE.appearance);
}

// Physical key mapper so Option chords map to physical keys cleanly
function comboFromKeyboardEvent(e) {
  // Block non-trusted / external injected / zero-keycode synthetic keys while recording
  if (!e.isTrusted) return null;
  const code = e.code || "";
  if (!code || e.keyCode === 0) return null;

  const modifierCodes = new Set([
    "MetaLeft", "MetaRight", "ControlLeft", "ControlRight",
    "AltLeft", "AltRight", "ShiftLeft", "ShiftRight", "CapsLock"
  ]);
  if (modifierCodes.has(code)) return { pendingModifierOnly: true };

  const codeMap = {
    Equal: "=", Minus: "-", BracketLeft: "[", BracketRight: "]",
    Quote: "'", Semicolon: ";", Backslash: "\\", Comma: ",", Slash: "/",
    Period: ".", Backquote: "`", Enter: "enter", NumpadEnter: "enter",
    Tab: "tab", Space: "space", Backspace: "backspace", Escape: "esc",
    Delete: "delete", ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down"
  };

  let keyName = codeMap[code] || "";
  if (!keyName && code.startsWith("Key") && code.length === 4) {
    keyName = code.slice(3).toLowerCase();
  } else if (!keyName && code.startsWith("Digit") && code.length === 6) {
    keyName = code.slice(5);
  } else if (!keyName && /^F([1-9]|1[0-2])$/.test(code)) {
    keyName = code.toLowerCase();
  }
  if (!keyName) return null;

  const mods = [];
  if (e.ctrlKey) mods.push("ctrl");
  if (e.altKey) mods.push("opt");
  if (e.shiftKey) mods.push("shift");
  if (e.metaKey) mods.push("cmd");

  if (mods.length === 0 && keyName === "esc") {
    return { cancel: true };
  }
  return { combo: [...mods, keyName].join("+") };
}

function formatComboDisplay(combo) {
  const parts = combo.split("+");
  const key = parts[parts.length - 1];
  const mods = new Set(parts.slice(0, -1));
  let out = "";
  if (mods.has("ctrl")) out += "⌃";
  if (mods.has("opt")) out += "⌥";
  if (mods.has("shift")) out += "⇧";
  if (mods.has("cmd")) out += "⌘";
  const keyPretty = {
    enter: "↩", esc: "⎋", tab: "⇥", space: "Space",
    backspace: "⌫", delete: "⌦", up: "↑", down: "↓", left: "←", right: "→"
  }[key] || key.toUpperCase();
  return out + keyPretty;
}

function installEdgeDragReorder({ container, rowSelector, idAttr, getDraggedId, setDraggedId, getOrderedIds, onCommit }) {
  if (!container) return;
  let lastTarget = null;

  function clearIndicators() {
    container.querySelectorAll(rowSelector).forEach(r => r.classList.remove("drop-before", "drop-after"));
    lastTarget = null;
  }

  function resolveInsertion(clientY) {
    const rows = Array.from(container.querySelectorAll(rowSelector));
    if (!rows.length) return null;
    const ids = getOrderedIds();
    const draggedId = getDraggedId();
    const fromIdx = ids.indexOf(draggedId);
    if (fromIdx < 0) return null;

    let bestRow = rows[rows.length - 1];
    let pos = "after";
    let hoveredIdx = rows.length - 1;

    for (let i = 0; i < rows.length; i++) {
      const rect = rows[i].getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (clientY < mid) {
        bestRow = rows[i];
        pos = "before";
        hoveredIdx = i;
        break;
      }
      if (clientY <= rect.bottom || i === rows.length - 1) {
        bestRow = rows[i];
        pos = "after";
        hoveredIdx = i;
        if (i === rows.length - 1 || clientY < rows[i + 1].getBoundingClientRect().top) {
          break;
        }
      }
    }

    const rawInsertIdx = (pos === "after") ? hoveredIdx + 1 : hoveredIdx;
    if (rawInsertIdx === fromIdx || rawInsertIdx === fromIdx + 1) {
      return { noop: true, fromIdx, rawInsertIdx, row: bestRow, pos };
    }
    return { noop: false, fromIdx, rawInsertIdx, row: bestRow, pos };
  }

  container.querySelectorAll(rowSelector).forEach(row => {
    const itemId = row.getAttribute(idAttr);
    row.addEventListener("dragstart", (e) => {
      setDraggedId(itemId);
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", itemId);
    });
    row.addEventListener("dragend", () => {
      setDraggedId(null);
      container.querySelectorAll(rowSelector).forEach(r => r.classList.remove("dragging"));
      clearIndicators();
    });
  });

  if (container.dataset.edgeWired) return;
  container.dataset.edgeWired = "1";

  container.addEventListener("dragover", (e) => {
    if (!getDraggedId()) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const info = resolveInsertion(e.clientY);
    clearIndicators();
    if (info && !info.noop) {
      info.row.classList.add(info.pos === "before" ? "drop-before" : "drop-after");
      lastTarget = info;
    }
  });

  container.addEventListener("dragleave", (e) => {
    if (!container.contains(e.relatedTarget)) {
      clearIndicators();
    }
  });

  container.addEventListener("drop", async (e) => {
    if (!getDraggedId()) return;
    e.preventDefault();
    const info = resolveInsertion(e.clientY) || lastTarget;
    clearIndicators();
    if (!info || info.noop) return;

    const order = [...getOrderedIds()];
    const draggedId = getDraggedId();
    const fromIdx = order.indexOf(draggedId);
    if (fromIdx < 0) return;
    const finalIdx = fromIdx < info.rawInsertIdx ? info.rawInsertIdx - 1 : info.rawInsertIdx;
    if (finalIdx === fromIdx) return;

    const [moved] = order.splice(fromIdx, 1);
    order.splice(finalIdx, 0, moved);
    await onCommit(order, moved, finalIdx + 1);
  });
}

function renderRail() {
  const list = document.getElementById("navList");
  const validOrder = STATE.sectionOrder.filter(id => SECTION_META[id]);
  for (const id of Object.keys(SECTION_META)) {
    if (!validOrder.includes(id)) validOrder.push(id);
  }
  STATE.sectionOrder = validOrder;

  list.innerHTML = validOrder.map(id => {
    const sec = SECTION_META[id];
    const active = !STATE.searchQuery && STATE.activeSection === id;
    return `
      <div class="nav-row ${active ? "active" : ""}" data-section="${id}" draggable="true">
        <span class="drag-grip" title="Drag to reorder">≡</span>
        <span class="nav-label">${escapeHTML(sec.title)}</span>
        <span class="kbd-hint">${escapeHTML(sec.badge)}</span>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".nav-row").forEach(row => {
    const secId = row.dataset.section;
    row.addEventListener("click", (e) => {
      if (e.target.classList.contains("drag-grip")) return;
      STATE.searchQuery = "";
      const searchEl = document.getElementById("settingsSearch");
      searchEl.value = "";
      document.getElementById("settingsSearchClear").classList.remove("visible");
      selectSection(secId);
    });
  });

  installEdgeDragReorder({
    container: list,
    rowSelector: ".nav-row",
    idAttr: "data-section",
    getDraggedId: () => dragSectionId,
    setDraggedId: (v) => { dragSectionId = v; },
    getOrderedIds: () => STATE.sectionOrder,
    onCommit: (order) => {
      STATE.sectionOrder = order;
      post({ type: "sectionOrder", order });
      renderRail();
      showToast("Saved sidebar order");
    }
  });
}

function renderGeneralSection() {
  const zoomPct = Math.round((STATE.pageZoom || 1.0) * 100);
  return `
    <div class="section-header">
      <div>
        <h1>General</h1>
        <p class="section-subtitle">Manage local Scrape &amp; Missed Log storage and display zoom.</p>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Scrape &amp; Missed Log Storage</h2>
      <p class="card-desc">All scrape runs and missed tracks are stored inside one local JSON log instead of separate CSV files. Currently tracking <strong>${STATE.runCount}</strong> saved runs.</p>
      <div class="path-box">${escapeHTML(STATE.storePath)}</div>
      <div class="btn-group">
        <button class="btn" id="revealDataBtn">Reveal in Finder</button>
        <button class="btn btn-danger" id="clearHistoryBtn">Clear Log History</button>
      </div>
    </div>

    <div class="card">
      <div class="row-between">
        <div>
          <h2 class="card-title">Display Zoom</h2>

        </div>
        <div class="btn-group">
          <button class="btn btn-sm" id="zoomOutBtn">−</button>
          <span class="kbd-hint" style="font-size:13px;padding:5px 10px">${zoomPct}%</span>
          <button class="btn btn-sm" id="zoomInBtn">+</button>
          <button class="btn btn-sm" id="zoomResetBtn">100%</button>
        </div>
      </div>
    </div>
  `;
}

function renderAppearanceSection() {
  const th = STATE.themes || {};
  const isDark = (th.currentSide || STATE.appearance) !== "light";
  const listed = Array.isArray(th.listedThemes) ? th.listedThemes : [];
  const nameDisplay = th.nameDisplay || "custom";

  const errorHTML = th.error
    ? `<div class="theme-error-banner">${nagaIconSVG("warn")} <span>${escapeHTML(th.error)}</span></div>`
    : "";

  const swatchCards = listed.length
    ? listed.map(item => {
        const p = item.palette || {};
        const bg = escapeHTML(p.bg || "#1e1f29");
        const surf = escapeHTML(p.surface || "#282a36");
        const text = escapeHTML(p.text || "#f8f8f2");
        const muted = escapeHTML(p.muted || "#a7b1d4");
        const accent = escapeHTML(p.accent || "#bd93f9");
        return `
          <button class="swatch-card ${item.active ? "selected" : ""}" data-select-theme="${escapeHTML(item.id)}" title="${escapeHTML(item.name)}">
            <div class="swatch-preview" style="background:${bg};border-color:${muted}33">
              <div class="swatch-top">
                <span class="swatch-dot" style="background:${accent}"></span>
                <span class="swatch-bar" style="background:${text};opacity:0.88"></span>
              </div>
              <div class="swatch-lines">
                <span class="swatch-line" style="background:${surf}"></span>
                <span class="swatch-line" style="background:${muted};opacity:0.65"></span>
              </div>
            </div>
            <div class="swatch-meta">
              <span class="swatch-title">${escapeHTML(item.name)}</span>
              ${item.active ? '<span class="swatch-check">✓</span>' : ""}
            </div>
          </button>
        `;
      }).join("")
    : `<div class="empty-state">No themes found on this appearance side.</div>`;

  return `
    <div class="section-header">
      <div>
        <h1>Appearance</h1>
        <p class="section-subtitle">Choose your Dark or Light theme across every New Music Research window.</p>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Window Appearance</h2>
      <p class="card-desc">Applies immediately across the main HUD, Scrape Log, Settings, Help, and About windows. Press <code>⇧⌘L</code> anytime to swap sides.</p>
      <div class="appearance-grid">
        <button class="theme-card ${isDark ? "selected" : ""}" data-pick-appearance="dark">
          <div class="theme-preview dark-prev">
            <div class="prev-bar"><span class="prev-dot"></span><span class="prev-line"></span></div>
            <div class="prev-blocks"><div class="prev-block"></div><div class="prev-block"></div></div>
          </div>
          <div class="theme-meta">
            <span>Dark Mode</span>
            ${isDark ? '<span class="badge">Active</span>' : ""}
          </div>
        </button>

        <button class="theme-card ${!isDark ? "selected" : ""}" data-pick-appearance="light">

function activePlaylistPresetData() {
  const po = STATE.playlistOrder || {};
  const defaults = Array.isArray(po.defaultPlaylists) ? po.defaultPlaylists : [];
  const presets = Array.isArray(po.presets) ? po.presets : [];
  const activeId = po.activePresetId || "default";
  if (activeId === "default") {
    return { isDefault: true, activeId: "default", preset: null, items: defaults, defaults, presets };
  }
  const preset = presets.find(p => p.id === activeId);
  if (!preset) {
    return { isDefault: true, activeId: "default", preset: null, items: defaults, defaults, presets };
  }
  return { isDefault: false, activeId, preset, items: preset.playlists || defaults, defaults, presets };
}

function nextCustomPresetName() {
  const presets = (STATE.playlistOrder && STATE.playlistOrder.presets) || [];
  let n = 1;
  while (presets.some(p => (p.name || "").toLowerCase() === `custom order ${n}`)) {
    n += 1;
  }
  return `Custom Order ${n}`;
}

      <div class="shortcut-info">

function filteredShortcuts() {
  const q = STATE.shortcutFilter.trim().toLowerCase();
  if (!q) return STATE.shortcuts;
  return STATE.shortcuts.filter(act => {
    const text = [
      act.title,
      act.section,
      act.id,
      ...(act.combos || []),
      ...(act.displays || []),
      ...(act.combos || []).map(formatComboDisplay)
    ].join(" ").toLowerCase();
    return text.includes(q);
  });
}

function renderShortcutsSection() {
  const items = filteredShortcuts();
  const grouped = new Map();
  for (const act of items) {
    if (!grouped.has(act.section)) grouped.set(act.section, []);
    grouped.get(act.section).push(act);
  }

  let bodyHTML = "";
  if (items.length === 0) {
    bodyHTML = `<div class="empty-state">No shortcuts match "${escapeHTML(STATE.shortcutFilter)}".</div>`;
  } else {
    for (const [groupName, rows] of grouped.entries()) {
      bodyHTML += `<div class="shortcut-group-title">${escapeHTML(groupName)}</div>`;
      bodyHTML += rows.map(renderShortcutRowHTML).join("");
    }
  }

  return `
    <div class="section-header">
      <div>
        <h1>Shortcuts</h1>
        <p class="section-subtitle">Assign multiple key combinations per action. Physical key codes keep ⌥ shortcuts reliable.</p>

function renderCrossSectionSearch(q) {
  const term = q.trim().toLowerCase();
  const blocks = [];

  if (SECTION_META.general.keywords.some(k => k.includes(term) || term.includes(k)) || "clear log history reveal finder zoom".includes(term)) {
    blocks.push(`<div class="search-match-group"><div class="search-match-badge">General</div>${renderGeneralSection()}</div>`);
  }
  if (SECTION_META.appearance.keywords.some(k => k.includes(term) || term.includes(k)) || "dark light dracula yellow swatch theme git menu bar".includes(term)) {
    blocks.push(`<div class="search-match-group"><div class="search-match-badge">Appearance</div>${renderAppearanceSection()}</div>`);
  }
  if (SECTION_META.playlists.keywords.some(k => k.includes(term) || term.includes(k)) || "playlist order preset tidal url".includes(term) || ((STATE.playlistOrder?.defaultPlaylists || []).some(p => (p.name + " " + p.url).toLowerCase().includes(term)))) {
    blocks.push(`<div class="search-match-group"><div class="search-match-badge">Playlist Order</div>${renderPlaylistsSection()}</div>`);
  }

  const matchedShortcuts = STATE.shortcuts.filter(act =>
    [act.title, act.section, act.id, ...(act.combos || []), ...(act.combos || []).map(formatComboDisplay)]
      .join(" ").toLowerCase().includes(term)
  );
  if (matchedShortcuts.length > 0 || "shortcuts hotkeys".includes(term)) {
    blocks.push(`
      <div class="search-match-group">
        <div class="search-match-badge">Shortcuts (${matchedShortcuts.length})</div>
        ${(matchedShortcuts.length ? matchedShortcuts : STATE.shortcuts).map(renderShortcutRowHTML).join("")}
      </div>
    `);
  }

  const matchedRoutes = STATE.urlRoutes.filter(r =>
    [r.route, r.summary, r.example, r.params].join(" ").toLowerCase().includes(term)
  );
  if (matchedRoutes.length > 0 || "url nmr://".includes(term)) {
    const list = matchedRoutes.length ? matchedRoutes : STATE.urlRoutes;
    blocks.push(`
      <div class="search-match-group">
        <div class="search-match-badge">URL Commands (${list.length})</div>
        ${list.map(r => `
          <div class="route-card">
            <div class="route-top">
              <span class="route-url">${escapeHTML(r.example)}</span>
              <div class="btn-group">
                <button class="btn btn-sm" data-copy-url="${escapeHTML(r.example)}">Copy</button>
                <button class="btn btn-sm btn-primary" data-run-url="${escapeHTML(r.example)}">Run</button>
              </div>
            </div>
            <div class="route-summary">${escapeHTML(r.summary)}</div>
            <div class="route-params">Parameters: ${escapeHTML(r.params)}</div>
          </div>
        `).join("")}
      </div>
    `);
  }

  if (blocks.length === 0) {
    return `<div class="empty-state">No settings matched "<strong>${escapeHTML(q)}</strong>".</div>`;
  }
  return `
    <div class="section-header">
      <div>
        <h1>Search Results</h1>
        <p class="section-subtitle">Matching controls across all Settings sections for "${escapeHTML(q)}".</p>
      </div>
    </div>
    ${blocks.join("")}
  `;
}

function renderContent() {
  const root = document.getElementById("contentRoot");
  const prevFilterFocus = document.activeElement && document.activeElement.id === "shortcutFilterInput";
  const prevFilterSelStart = prevFilterFocus ? document.activeElement.selectionStart : null;

  if (STATE.searchQuery.trim()) {
    root.innerHTML = renderCrossSectionSearch(STATE.searchQuery);
  } else {
    switch (STATE.activeSection) {
      case "appearance": root.innerHTML = renderAppearanceSection(); break;
      case "playlists": root.innerHTML = renderPlaylistsSection(); break;
      case "shortcuts": root.innerHTML = renderShortcutsSection(); break;
      case "urls": root.innerHTML = renderURLsSection(); break;
      default: root.innerHTML = renderGeneralSection(); break;
    }
  }

  wireDynamicHandlers();
  if (prevFilterFocus) {
    const el = document.getElementById("shortcutFilterInput");
    if (el) {
      el.focus();
      if (prevFilterSelStart !== null) {
        el.setSelectionRange(prevFilterSelStart, prevFilterSelStart);
      }
    }
  }
  updateScrollFade();
}

function wireDynamicHandlers() {
  const revealBtn = document.getElementById("revealDataBtn");
  if (revealBtn) revealBtn.addEventListener("click", () => post({ type: "revealDataDir" }));

  const clearHistBtn = document.getElementById("clearHistoryBtn");
  if (clearHistBtn) {
    clearHistBtn.addEventListener("click", async () => {
      const ok = await askConfirm({
        title: "Clear All Scrape & Missed Log History?",
        subtitle: "This permanently removes saved runs from the in-app log.",
        tile: "trash",
        facts: [
          ["Saved runs", `${STATE.runCount} run(s)`],
          ["File", STATE.storePath],
          ["Spotify & CSVs", "Existing Spotify playlists and disk folders are not deleted."]
        ]
      });
      if (ok) {
        post({ type: "clearHistory" });
        showToast("Log history cleared");
      }
    });
  }

  const zIn = document.getElementById("zoomInBtn");
  const zOut = document.getElementById("zoomOutBtn");
  const zReset = document.getElementById("zoomResetBtn");
  if (zIn) zIn.addEventListener("click", () => post({ type: "zoom", action: "in" }));
  if (zOut) zOut.addEventListener("click", () => post({ type: "zoom", action: "out" }));
  if (zReset) zReset.addEventListener("click", () => post({ type: "zoom", action: "reset" }));

  document.querySelectorAll("[data-pick-appearance]").forEach(btn => {
    btn.addEventListener("click", () => {
      const mode = btn.dataset.pickAppearance;
      setTheme(mode);
      post({ type: "setAppearance", mode });
      renderContent();
    });
  });

  document.querySelectorAll("[data-select-theme]").forEach(btn => {
    btn.addEventListener("click", () => {
      post({ type: "selectTheme", id: btn.dataset.selectTheme });
    });
  });

  document.querySelectorAll("[data-name-display]").forEach(btn => {
    btn.addEventListener("click", () => {
      post({ type: "setThemeNameDisplay", mode: btn.dataset.nameDisplay });
    });
  });

  const chooseThemesBtn = document.getElementById("chooseThemesFolderBtn");
  if (chooseThemesBtn) chooseThemesBtn.addEventListener("click", () => post({ type: "chooseThemesFolder" }));
  const revealThemesBtn = document.getElementById("revealThemesFolderBtn");
  if (revealThemesBtn) revealThemesBtn.addEventListener("click", () => post({ type: "revealThemesFolder" }));
  const resetThemesBtn = document.getElementById("resetThemesFolderBtn");
  if (resetThemesBtn) resetThemesBtn.addEventListener("click", () => post({ type: "resetThemesFolder" }));

  // Playlist Order & Presets
  document.querySelectorAll("[data-select-preset]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.selectPreset;
      const presetName = id === "default"
        ? "Default"
        : ((STATE.playlistOrder?.presets || []).find(p => p.id === id)?.name || "Preset");
      post({ type: "selectPreset", id });
      showToast("Saved active preset: " + presetName);
    });
  });

  document.querySelectorAll("[data-run-scrape]").forEach(btn => {
    btn.addEventListener("click", () => {
      const data = activePlaylistPresetData();
      const presetLabel = data.isDefault ? "Default" : data.preset.name;
      const mode = btn.dataset.runScrape;
      document.querySelectorAll("[data-run-scrape]").forEach(b => { b.disabled = true; });
      btn.innerHTML = `${nagaIconSVG("spinner")} Checking Spotify…`;
      showToast(`Checking Spotify (${presetLabel})…`);
      post({ type: "runScrape", mode, presetId: data.activeId });
    });
  });

  const newPresetBtn = document.getElementById("newPresetBtn");
  if (newPresetBtn) {
    newPresetBtn.addEventListener("click", async () => {
      const data = activePlaylistPresetData();
      const name = await askNameModal({
        title: "New Custom Preset",
        subtitle: "Starts from the current playlist sequence.",
        initialValue: nextCustomPresetName(),
        saveLabel: "Create Preset"
      });
      if (name) {
        post({ type: "createPreset", name, urls: data.items.map(p => p.url) });
        showToast("Saved new preset: " + name);
      }
    });
  }

  const dupBtn = document.getElementById("duplicateDefaultPresetBtn");
  if (dupBtn) {
    dupBtn.addEventListener("click", async () => {
      const data = activePlaylistPresetData();
      const name = await askNameModal({
        title: "Duplicate Default Order",
        subtitle: "Create an editable custom preset with the Default order.",
        initialValue: nextCustomPresetName(),
        saveLabel: "Create Preset"
      });
      if (name) {
        post({ type: "createPreset", name, urls: data.items.map(p => p.url) });
        showToast("Saved custom preset: " + name);
      }
    });
  }

  const renamePresetBtn = document.getElementById("renamePresetBtn");
  if (renamePresetBtn) {
    renamePresetBtn.addEventListener("click", async () => {
      const data = activePlaylistPresetData();
      if (data.isDefault || !data.preset) return;
      const name = await askNameModal({
        title: "Rename Preset",
        subtitle: `Current name: ${data.preset.name}`,
        initialValue: data.preset.name,
        saveLabel: "Rename"
      });
      if (name) {
        post({ type: "renamePreset", id: data.preset.id, name });
        showToast("Saved preset name: " + name);
      }
    });
  }

  const resetPresetBtn = document.getElementById("resetPresetOrderBtn");
  if (resetPresetBtn) {
    resetPresetBtn.addEventListener("click", async () => {
      const data = activePlaylistPresetData();
      if (data.isDefault || !data.preset) return;
      const ok = await askConfirm({
        title: "Reset Preset to Default Order?",
        subtitle: `Reverts "${data.preset.name}" back to the original playlist order.`,
        tile: "↺",
        facts: [
          ["Preset", data.preset.name],
          ["Playlists", `${data.defaults.length} playlists`]
        ]
      });
      if (ok) {
        post({ type: "updatePresetOrder", id: data.preset.id, urls: data.defaults.map(p => p.url) });
        showToast("Saved Default order to " + data.preset.name);
      }
    });
  }

  const deletePresetBtn = document.getElementById("deletePresetBtn");
  if (deletePresetBtn) {
    deletePresetBtn.addEventListener("click", async () => {
      const data = activePlaylistPresetData();
      if (data.isDefault || !data.preset) return;
      const ok = await askConfirm({
        title: `Delete Preset "${data.preset.name}"?`,
        subtitle: "Your Default preset will remain untouched and become active.",
        tile: "trash",
        facts: [["Preset", data.preset.name]]
      });
      if (ok) {
        post({ type: "deletePreset", id: data.preset.id });
        showToast("Deleted " + data.preset.name + " · Active: Default");
      }
    });
  }

  async function applyNewPlaylistSequence(urlsOrdered, movedName = "", newRank = null) {
    const data = activePlaylistPresetData();
    const posNote = (movedName && newRank) ? `${movedName} → #${newRank}` : "Updated sequence";
    if (data.isDefault) {
      const name = await askNameModal({
        title: "Save Reorder as New Custom Preset",
        subtitle: "Default stays locked so you always have the original order.",
        initialValue: nextCustomPresetName(),
        saveLabel: "Save Preset"
      });
      if (name) {
        post({ type: "createPreset", name, urls: urlsOrdered });
        showToast(`Saved ${posNote} in "${name}"`);
      }
    } else if (data.preset) {
      post({ type: "updatePresetOrder", id: data.preset.id, urls: urlsOrdered });
      showToast(`Saved ${posNote} in "${data.preset.name}"`);
    }
  }

  document.querySelectorAll("[data-move-playlist]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const dir = btn.dataset.movePlaylist;
      const idx = Number(btn.dataset.playlistIndex);
      const data = activePlaylistPresetData();
      const urls = data.items.map(p => p.url);
      const targetIdx = dir === "up" ? idx - 1 : idx + 1;
      if (targetIdx < 0 || targetIdx >= urls.length) return;
      const movedName = data.items[idx]?.name || "";
      const [moved] = urls.splice(idx, 1);
      urls.splice(targetIdx, 0, moved);
      await applyNewPlaylistSequence(urls, movedName, targetIdx + 1);
    });
  });

  const playlistContainer = document.getElementById("playlistOrderList");
  if (playlistContainer) {
    installEdgeDragReorder({
      container: playlistContainer,
      rowSelector: ".playlist-row",
      idAttr: "data-playlist-url",
      getDraggedId: () => dragPlaylistUrl,
      setDraggedId: (v) => { dragPlaylistUrl = v; },
      getOrderedIds: () => activePlaylistPresetData().items.map(p => p.url),
      onCommit: async (urlsOrdered, movedUrl, newRank) => {
        const movedName = activePlaylistPresetData().items.find(p => p.url === movedUrl)?.name || "";
        await applyNewPlaylistSequence(urlsOrdered, movedName, newRank);
      }
    });
  }

  document.querySelectorAll("[data-open-url]").forEach(btn => {
    btn.addEventListener("click", () => {
      post({ type: "openExternalURL", url: btn.dataset.openUrl });
    });
  });

  const wtToggle = document.getElementById("worktreeMenuToggle");
  if (wtToggle) {
    wtToggle.addEventListener("change", () => {
      STATE.showWorktreeMenu = wtToggle.checked;
      post({ type: "setWorktreeMenu", show: wtToggle.checked });
    });
  }

  const filterInput = document.getElementById("shortcutFilterInput");
  if (filterInput) {
    filterInput.addEventListener("input", () => {
      STATE.shortcutFilter = filterInput.value;
      renderContent();
    });
  }

  const filterClear = document.getElementById("shortcutFilterClear");
  if (filterClear) {
    filterClear.addEventListener("click", () => {
      STATE.shortcutFilter = "";
      STATE.pressKeysFilter = false;
      renderContent();
      const inp = document.getElementById("shortcutFilterInput");
      if (inp) inp.focus();
    });
  }

  const pressBtn = document.getElementById("pressKeysBtn");
  if (pressBtn) {
    pressBtn.addEventListener("click", () => {
      STATE.pressKeysFilter = !STATE.pressKeysFilter;
      STATE.recordingActionId = null;
      post({ type: "recording", active: STATE.pressKeysFilter });
      renderContent();
    });
  }

  const resetAllBtn = document.getElementById("resetAllShortcutsBtn");
  if (resetAllBtn) {
    resetAllBtn.addEventListener("click", () => {
      STATE.conflictMessage = "";
      post({ type: "resetAllShortcuts" });
      showToast("All shortcuts reset to defaults");
    });
  }

  document.querySelectorAll("[data-remove-combo]").forEach(btn => {
    btn.addEventListener("click", () => {
      const actionId = btn.dataset.removeCombo;
      const idx = Number(btn.dataset.comboIndex);
      const act = STATE.shortcuts.find(a => a.id === actionId);
      if (!act) return;
      const next = [...(act.combos || [])];
      next.splice(idx, 1);
      STATE.conflictMessage = "";
      post({ type: "setCombos", actionId, combos: next });
    });
  });

  document.querySelectorAll("[data-record-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.recordAction;
      STATE.pressKeysFilter = false;
      STATE.recordingActionId = STATE.recordingActionId === id ? null : id;
      STATE.conflictMessage = "";
      post({ type: "recording", active: Boolean(STATE.recordingActionId) });
      renderContent();
    });
  });

  document.querySelectorAll("[data-reset-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      STATE.conflictMessage = "";
      post({ type: "resetShortcut", actionId: btn.dataset.resetAction });
    });
  });

  document.querySelectorAll("[data-copy-url]").forEach(btn => {
    btn.addEventListener("click", () => {
      const u = btn.dataset.copyUrl;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(u).catch(() => {});
      }
      post({ type: "copyText", text: u });
      showToast("Copied " + u);
    });
  });

  document.querySelectorAll("[data-run-url]").forEach(btn => {
    btn.addEventListener("click", () => {
      post({ type: "runURL", url: btn.dataset.runUrl });
    });
  });
}

function selectSection(sectionId) {
  if (!SECTION_META[sectionId]) return;
  STATE.activeSection = sectionId;
  STATE.recordingActionId = null;
  STATE.pressKeysFilter = false;
  post({ type: "recording", active: false });
  renderRail();
  renderContent();
  document.getElementById("contentScroll").scrollTop = 0;
}

function updateScrollFade() {
  const scroller = document.getElementById("contentScroll");
  const fade = document.getElementById("scrollFade");
  const remaining = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
  fade.classList.toggle("visible", remaining > 24);
}

function nagaIconSVG(kind) {
  const map = { "🎵": "music", "⚠️": "warn", "⚠": "warn", "🗑️": "trash", "🗑": "trash", "🎛️": "preset", "🎛": "preset", "🟠": "lastweek" };
  const id = map[String(kind || "warn").trim()] || String(kind || "warn").trim();
  const c = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  if (id === "music") {
    return `<svg ${c}><polygon points="12 2.4 20.4 7.2 20.4 16.8 12 21.6 3.6 16.8 3.6 7.2" opacity="0.45"/><line x1="7.5" y1="15.2" x2="7.5" y2="10.8"/><line x1="10.5" y1="17" x2="10.5" y2="7"/><line x1="13.5" y1="15.5" x2="13.5" y2="9"/><line x1="16.5" y1="14.2" x2="16.5" y2="11.2"/></svg>`;
  }
  if (id === "trash") {
    return `<svg ${c}><path d="M4.5 7.5h15M9 4.5h6l.8 3H8.2l.8-3Z"/><path d="M7 7.5l.9 12.2h8.2l.9-12.2"/><line x1="10.3" y1="11.2" x2="10.3" y2="16.2"/><line x1="13.7" y1="11.2" x2="13.7" y2="16.2"/></svg>`;
  }
  if (id === "preset") {
    return `<svg ${c}><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.1" fill="var(--surface)"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.1" fill="var(--surface)"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="10.5" cy="17" r="2.1" fill="var(--surface)"/></svg>`;
  }
  if (id === "play") {
    return `<svg ${c}><polygon points="7 5 19 12 7 19 7 5"/></svg>`;
  }
  if (id === "spinner") {
    return `<svg ${c} class="nmr-spin"><path d="M12 3a9 9 0 1 0 9 9"/></svg>`;
  }
  return `<svg ${c}><path d="M12 3.4 21 19a1 1 0 0 1-.86 1.5H3.86A1 1 0 0 1 3 19L12 3.4Z"/><line x1="12" y1="9.4" x2="12" y2="14"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg>`;
}

function askConfirm({ title, subtitle, tile = "warn", facts = [] }) {
  return new Promise(resolve => {
    confirmResolver = resolve;
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmSubtitle").textContent = subtitle || "";
    document.getElementById("confirmTile").innerHTML = nagaIconSVG(tile);
    document.getElementById("confirmFacts").innerHTML = facts.map(([k, v]) =>
      `<tr><td>${escapeHTML(k)}</td><td>${escapeHTML(v)}</td></tr>`
    ).join("");
    document.getElementById("confirmModal").classList.add("open");
  });
}

function resolveConfirm(answer) {
  const modal = document.getElementById("confirmModal");
  if (!modal.classList.contains("open")) return;
  modal.classList.remove("open");
  const r = confirmResolver;
  confirmResolver = null;
  if (r) r(Boolean(answer));
}

document.getElementById("confirmYesBtn").addEventListener("click", () => resolveConfirm(true));
document.getElementById("confirmNoBtn").addEventListener("click", () => resolveConfirm(false));

function askNameModal({ title, subtitle = "", initialValue = "", saveLabel = "Save" }) {
  return new Promise(resolve => {
    nameModalResolver = resolve;
    document.getElementById("nameModalTitle").textContent = title;
    document.getElementById("nameModalSubtitle").textContent = subtitle;
    document.getElementById("nameSaveBtn").innerHTML = `${escapeHTML(saveLabel)} <span class="kbd-hint">↩</span>`;
    const inp = document.getElementById("nameModalInput");
    inp.value = initialValue;
    document.getElementById("nameModal").classList.add("open");
    setTimeout(() => { inp.focus(); inp.select(); }, 20);
  });
}

function resolveNameModal(confirmed) {
  const modal = document.getElementById("nameModal");
  if (!modal.classList.contains("open")) return;
  const val = confirmed ? document.getElementById("nameModalInput").value.trim() : null;
  modal.classList.remove("open");
  const r = nameModalResolver;
  nameModalResolver = null;
  if (r) r(val && val.length ? val : null);
}

document.getElementById("nameSaveBtn").addEventListener("click", () => resolveNameModal(true));
document.getElementById("nameCancelBtn").addEventListener("click", () => resolveNameModal(false));

document.getElementById("moreBtn").addEventListener("click", () => {
  const scroller = document.getElementById("contentScroll");
  scroller.scrollBy({ top: Math.round(scroller.clientHeight * 0.72), behavior: "smooth" });
});
document.getElementById("contentScroll").addEventListener("scroll", updateScrollFade);
window.addEventListener("resize", updateScrollFade);

document.getElementById("closeSettingsBtn").addEventListener("click", () => post({ type: "close" }));

const settingsSearch = document.getElementById("settingsSearch");
const settingsSearchClear = document.getElementById("settingsSearchClear");
settingsSearch.addEventListener("input", () => {
  STATE.searchQuery = settingsSearch.value;
  settingsSearchClear.classList.toggle("visible", Boolean(settingsSearch.value));
  renderRail();
  renderContent();
});
settingsSearchClear.addEventListener("click", () => {
  STATE.searchQuery = "";
  settingsSearch.value = "";
  settingsSearchClear.classList.remove("visible");
  renderRail();
  renderContent();
  settingsSearch.focus();
});

// Keyboard handling inside Settings window
window.addEventListener("keydown", (e) => {
  // Confirm modal keys first
  if (document.getElementById("confirmModal").classList.contains("open")) {
    e.preventDefault();
    const k = e.key.toLowerCase();
    if (k === "y" || e.key === "Enter") resolveConfirm(true);
    else if (k === "n" || e.key === "Escape") resolveConfirm(false);
    return;
  }

  // Name input modal keys
  if (document.getElementById("nameModal").classList.contains("open")) {
    if (e.key === "Enter") {
      e.preventDefault();
      resolveNameModal(true);
    } else if (e.key === "Escape") {
      e.preventDefault();
      resolveNameModal(false);
    }
    return;
  }

  // Shortcut recording or PRESS KEYS filter
  if (STATE.recordingActionId || STATE.pressKeysFilter) {
    e.preventDefault();
    e.stopPropagation();
    const parsed = comboFromKeyboardEvent(e);
    if (!parsed || parsed.pendingModifierOnly) return;
    if (parsed.cancel) {
      STATE.recordingActionId = null;
      STATE.pressKeysFilter = false;
      post({ type: "recording", active: false });
      renderContent();
      return;
    }
    const combo = parsed.combo;
    if (STATE.pressKeysFilter) {
      STATE.shortcutFilter = combo;
      STATE.pressKeysFilter = false;
      post({ type: "recording", active: false });
      renderContent();
      return;
    }

    const actionId = STATE.recordingActionId;
    STATE.recordingActionId = null;
    post({ type: "recording", active: false });

    if (RESERVED_COMBOS.has(combo)) {
      STATE.conflictMessage = `${formatComboDisplay(combo)} is reserved by macOS and cannot be reassigned.`;
      renderContent();
      return;
    }
    const clash = STATE.shortcuts.find(a => a.id !== actionId && (a.combos || []).includes(combo));
    if (clash) {
      STATE.conflictMessage = `${formatComboDisplay(combo)} is already assigned to "${clash.title}". Remove it there first or pick another combo.`;
      renderContent();
      return;
    }

    const act = STATE.shortcuts.find(a => a.id === actionId);
    const existing = act ? [...(act.combos || [])] : [];
    if (!existing.includes(combo)) existing.push(combo);
    STATE.conflictMessage = "";
    post({ type: "setCombos", actionId, combos: existing });
    renderContent();
    return;
  }

  // Cmd+F focuses Shortcuts filter in place
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "f") {
    e.preventDefault();
    if (STATE.activeSection !== "shortcuts") {
      STATE.searchQuery = "";
      settingsSearch.value = "";
      settingsSearchClear.classList.remove("visible");
      selectSection("shortcuts");
    }
    const inp = document.getElementById("shortcutFilterInput");
    if (inp) { inp.focus(); inp.select(); }
    return;
  }

  // Esc clears search/filter before closing Settings
  if (e.key === "Escape") {
    if (STATE.searchQuery) {
      e.preventDefault();
      STATE.searchQuery = "";
      settingsSearch.value = "";
      settingsSearchClear.classList.remove("visible");
      renderRail();
      renderContent();
      settingsSearch.focus();
      return;
    }
    if (STATE.shortcutFilter) {
      e.preventDefault();
      STATE.shortcutFilter = "";
      renderContent();
      return;
    }
    post({ type: "close" });
    return;
  }

  // Ctrl+G / Ctrl+A / Ctrl+P / Ctrl+H / Ctrl+U section jumps
  if (e.ctrlKey && !e.metaKey && !e.altKey) {
    const k = e.key.toLowerCase();
    const map = { g: "general", a: "appearance", p: "playlists", h: "shortcuts", u: "urls" };
    if (map[k]) {
      e.preventDefault();
      STATE.searchQuery = "";
      settingsSearch.value = "";
      settingsSearchClear.classList.remove("visible");
      selectSection(map[k]);
      return;
    }
  }
});

// Bridges called by Swift
window.NMRSettings = {
  hydrate(payload) {
    if (!payload) return;
    if (payload.appearance) setTheme(payload.appearance);
    if (typeof payload.pageZoom === "number") STATE.pageZoom = payload.pageZoom;
    if (typeof payload.showWorktreeMenu === "boolean") STATE.showWorktreeMenu = payload.showWorktreeMenu;
    if (Array.isArray(payload.sectionOrder) && payload.sectionOrder.length) STATE.sectionOrder = payload.sectionOrder;
    if (payload.storePath) STATE.storePath = payload.storePath;
    if (typeof payload.runCount === "number") STATE.runCount = payload.runCount;
    if (Array.isArray(payload.shortcuts)) STATE.shortcuts = payload.shortcuts;
    if (Array.isArray(payload.urlRoutes)) STATE.urlRoutes = payload.urlRoutes;
    if (payload.themes && typeof payload.themes === "object") STATE.themes = payload.themes;
    if (payload.playlistOrder && typeof payload.playlistOrder === "object") STATE.playlistOrder = payload.playlistOrder;
    if (payload.section && SECTION_META[payload.section]) {
      STATE.activeSection = payload.section;
      STATE.searchQuery = "";
      settingsSearch.value = "";
      settingsSearchClear.classList.remove("visible");
    }
    const openAct = STATE.shortcuts.find(a => a.id === "openSettings");
    if (openAct && openAct.displays && openAct.displays.length) {
      document.getElementById("shortcutSummaryBadge").textContent = openAct.displays[0];
    }
    renderRail();
    renderContent();
  },
  selectSection(sectionId) {
    STATE.searchQuery = "";
    settingsSearch.value = "";
    settingsSearchClear.classList.remove("visible");
    selectSection(sectionId);
  },
  focusSearch() {
    const inp = document.getElementById("settingsSearch");
    if (inp) {
      inp.focus();
      inp.select();
    }
  },
  setTheme(mode) {
    setTheme(mode);
    renderContent();
  },
  getState() {
    return {
      activeSection: STATE.activeSection,
      appearance: STATE.appearance,
      activeThemeId: STATE.themes ? STATE.themes.activeThemeId : "",
      activeThemeName: STATE.themes ? STATE.themes.activeThemeName : "",
      activePresetId: STATE.playlistOrder ? STATE.playlistOrder.activePresetId : "default",
      presetCount: STATE.playlistOrder && Array.isArray(STATE.playlistOrder.presets) ? STATE.playlistOrder.presets.length : 0,
      pageZoom: STATE.pageZoom,
      showWorktreeMenu: STATE.showWorktreeMenu,
      searchQuery: STATE.searchQuery,
      shortcutCount: STATE.shortcuts.length,
      urlRouteCount: STATE.urlRoutes.length
    };
  }
};

renderRail();
renderContent();
post({ type: "ready" });
</script>
